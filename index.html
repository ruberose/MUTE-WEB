<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- SEO 최적화 타이틀 및 메타태그 -->
  <title>MUSE-WEB | 감성 ASMR 백색소음 플레이어 (Step 1 기능검증)</title>
  <meta name="description" content="MUSE-WEB의 Step 1 기능 검증 페이지입니다. 빗소리, 장작 소리, 시냇물 소리를 동시에 무한 재생 및 정지 제어할 수 있는 초경량 웹 오디오 환경입니다.">
  
  <!-- CSS 스타일시트 상대경로 참조 -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 메인 레이아웃 컨테이너 -->
  <main class="app-container" id="main-container">
    
    <!-- 타이틀 영역 -->
    <header>
      <h1 id="app-title">MUSE-WEB ASMR (Step 1)</h1>
      <p class="description" id="app-description">기능 작동 여부만 검증하는 단순 테스트용 웹사이트입니다.</p>
    </header>

    <!-- 컨트롤러 영역: 전체 재생 및 전체 정지 버튼 -->
    <section class="controls-container" id="player-controls">
      <button type="button" id="btn-play-all">전체 재생</button>
      <button type="button" id="btn-stop-all">전체 정지</button>
    </section>

    <!-- 오디오 목록 및 각 오디오의 현재 상태 레이아웃 -->
    <section class="sounds-container" id="sounds-section">
      <h2 style="font-size: 18px; margin-bottom: 15px; color: #34495e;">음원 상태 현황</h2>
      
      <ul class="sounds-list" id="sounds-list">
        <!-- 빗소리 사운드 행 -->
        <li class="sound-item" id="item-rain">
          <span class="sound-name">🌧️ 차분한 빗소리</span>
          <span class="sound-status" id="status-rain">준비 대기 중</span>
        </li>
        <!-- 장작 소리 사운드 행 -->
        <li class="sound-item" id="item-campfire">
          <span class="sound-name">🔥 따뜻한 장작 소리</span>
          <span class="sound-status" id="status-campfire">준비 대기 중</span>
        </li>
        <!-- 시냇물 소리 사운드 행 -->
        <li class="sound-item" id="item-stream">
          <span class="sound-name">🏞️ 맑은 시냇물 소리</span>
          <span class="sound-status" id="status-stream">준비 대기 중</span>
        </li>
      </ul>
    </section>

  </main>

  <!-- 자바스크립트 모듈 상대경로 참조 -->
  <script src="js/script.js"></script>
</body>
</html>
