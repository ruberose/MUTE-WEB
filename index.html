<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- SEO 최적화 타이틀 및 메타태그 -->
  <title>MUTE-WEB | 감성 ASMR 백색소음 플레이어 (Focus Mode UI 가리기)</title>
  <meta name="description" content="MUTE-WEB의 Step 10 Focus Mode 페이지입니다. 불멍 영상을 방해 없이 감상할 수 있도록 메인 화면의 각 컴포넌트 구획마다 개별 임시 제거 버튼(✕)을 탑재했습니다.">
  
  <!-- CSS 스타일시트 상대경로 참조 -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ==========================================================================
       [Step 8] 첫 페이지 테마 선택 화면 (Theme Selection Page)
       ========================================================================== -->
  <div id="theme-select-page">
    <div class="theme-select-container">
      <!-- 헤더 및 안내 메시지 -->
      <h1 class="theme-select-title">MUTE-WEB ASMR</h1>
      <p class="theme-select-subtitle">원하는 백색소음 테마를 선택해 몰입을 시작해 보세요.</p>
      
      <!-- 테마 선택 버튼 그룹 (요구사항 2-2: 자연, 판타지, 공포 테마 배치) -->
      <div class="theme-buttons-grid">
        <!-- 🌳 자연 테마 선택 버튼 -->
        <button type="button" class="btn-theme-select" id="btn-theme-nature">
          <span class="theme-icon">🌳</span>
          <span class="theme-name">자연 테마</span>
        </button>

        <!-- 🔮 판타지 테마 선택 버튼 -->
        <button type="button" class="btn-theme-select" id="btn-theme-fantasy">
          <span class="theme-icon">🔮</span>
          <span class="theme-name">판타지 테마</span>
        </button>

        <!-- 👻 공포 테마 선택 버튼 -->
        <button type="button" class="btn-theme-select" id="btn-theme-horror">
          <span class="theme-icon">👻</span>
          <span class="theme-name">공포 테마</span>
        </button>
      </div>
    </div>
  </div>


  <!-- ==========================================================================
       [Step 8] 기존 믹서 및 멍 페이지 전체 영역 (Mixer Page Container) - 평소 숨김 처리
       ========================================================================== -->
  <div id="mixer-page" style="display: none;">

    <!-- ==========================================================================
         영역 1: 메인 화면 (Main Arena Content)
         ========================================================================== -->
    <main class="main-arena" id="main-arena">
      
      <!-- [Step 10 후속] 최상단 이동/설정 버튼 가리기용 조그만 단추 (요구사항 1) -->
      <button type="button" class="btn-ui-hide" id="btn-hide-header" data-target="header-buttons" title="최상단 버튼 가리기">✕ 버튼 가리기</button>

      <!-- 좌측 상단 테마 선택 화면 복귀 단추 (👈) -->
      <button type="button" class="btn-theme-back" id="btn-theme-back">👈 테마 선택으로</button>

      <!-- 우측 상단 설정 서랍 개폐 단추 (⚙️) -->
      <button type="button" class="btn-settings-toggle" id="btn-drawer-toggle">⚙️ 사운드 조절 및 설정</button>

      <!-- 타이틀 영역 -->
      <header>
        <h1 id="app-title">MUTE-WEB ASMR</h1>
        <p class="description" id="app-description">복잡한 설정은 숨겨두고, 비주얼과 소리에 깊이 몰입해 보세요.</p>
      </header>

      <!-- 상단 제어 및 마스터 볼륨 영역 -->
      <section class="top-controls-wrapper" id="top-controls">
        <!-- [Step 10 후속] 개별 UI 가리기 버튼 (요구사항 1) -->
        <button type="button" class="btn-ui-hide" data-target="top-controls" title="볼륨 조절 영역 숨기기">✕ 영역 가리기</button>

        <!-- 전체 재생 및 전체 정지 버튼 -->
        <div class="controls-container" id="player-controls">
          <button type="button" id="btn-play-all">전체 재생</button>
          <button type="button" id="btn-stop-all">전체 정지</button>
        </div>

        <!-- 전체 음량을 조절하는 마스터 볼륨 슬라이더 구성 -->
        <div class="master-volume-container" id="master-volume-box">
          <label for="master-volume" class="master-volume-label" id="master-volume-label">🎚️ 마스터 볼륨</label>
          <input type="range" class="master-volume-slider" id="master-volume" min="0" max="1" step="0.01" value="1" aria-label="전체 마스터 볼륨 조절">
        </div>
      </section>

      <!-- 중앙 대형 비주얼 멍 타겟 공간 -->
      <section class="visual-space" id="visual-space-zone" title="멍 타겟 영역을 클릭하거나 아래 복구 단추를 누르면 가려진 UI가 모두 복구됩니다.">
        <div style="text-align: center; position: relative; z-index: 10;">
          <span style="font-size: 32px; display: block; margin-bottom: 10px;" id="theme-visual-emoji">🌊</span>
          <!-- [Step 9] 메인 멍 타겟 공간의 배경명 텍스트 영역 추가 (요구사항 1-1) -->
          <h2 id="current-bg-name" style="margin: 0 0 10px 0; color: #2c3e50; font-size: 20px;">모닥불</h2>
          <span id="theme-visual-text" style="display: block; margin-bottom: 15px;">마음의 평화를 위한 대형 비주얼 멍 타겟 공간</span>

          <!-- [Step 10 후속] 가려진 UI를 일괄 복구시킬 수 있는 마스터 복구 버튼 (요구사항 2) -->
          <button type="button" class="btn-ui-restore" id="btn-ui-restore" style="display: none;">🔄 숨겨진 UI 모두 복구</button>
        </div>
      </section>

      <!-- 오디오 페이드아웃 직접 지정 타이머 제어판 -->
      <section class="timer-container" id="timer-section">
        <!-- [Step 10 후속] 개별 UI 가리기 버튼 (요구사항 1) -->
        <button type="button" class="btn-ui-hide" data-target="timer-section" title="타이머 영역 숨기기">✕ 영역 가리기</button>

        <h3 class="timer-title" id="timer-section-title">⏱️ 취침 예약 타이머</h3>
        
        <!-- 수치 입력창, 시작 및 취소 단추 수평 배치 영역 -->
        <div class="timer-controls-row" id="timer-inputs-container">
          <!-- 분 단위 정수 입력창 -->
          <input type="number" class="timer-input-field" id="timer-input" min="1" placeholder="분 입력">
          
          <!-- 타이머 개시 버튼 -->
          <button type="button" class="btn-timer-action" id="btn-timer-start">타이머 시작</button>
          
          <!-- 타이머 취소 버튼 -->
          <button type="button" class="btn-timer-action" id="btn-timer-cancel">타이머 취소</button>
        </div>

        <!-- 실시간 남은 시간 표시 라벨 -->
        <div class="timer-display-label" id="timer-display">남은 시간: 없음</div>
      </section>

    </main>

    <!-- ==========================================================================
         영역 2: 설정 서랍 (Sidebar Drawer Content)
         ========================================================================== -->
    <aside class="settings-drawer" id="settings-drawer">
      
      <!-- 서랍장 상단 타이틀 및 닫기 버튼 -->
      <div class="drawer-header" id="drawer-top">
        <h2 class="drawer-title" id="drawer-heading">⚙️ 사운드 상세 믹서</h2>
        <button type="button" class="btn-drawer-close" id="btn-drawer-close">✕ 닫기</button>
      </div>

      <!-- 음원별 볼륨 및 동작 제어 개별 리스트 (Step 8/9/10: 자바스크립트에서 동적 생성) -->
      <section class="sounds-container" id="sounds-section">
        <ul class="sounds-list" id="sounds-list">
          <!-- [Step 8/9/10] js/script.js 에서 선택한 테마에 맞는 사운드 아이템들을 동적으로 삽입합니다. -->
        </ul>
      </section>

      <!-- 구글 애드센스 규격(300x250) 광고 배너 예정 영역 확보 -->
      <div class="ad-banner-holder" style="width:300px; height:250px; background-color:#eee; margin:20px auto; text-align:center; line-height:250px; color:#666; border:1px solid #cbd5e1; border-radius:4px; font-weight:bold; font-size:12px;">
        [구글 광고 배너 예정 영역 (300x250)]
      </div>

    </aside>

  </div>

  <!-- 자바스크립트 모듈 상대경로 참조 -->
  <script src="js/script.js"></script>
</body>
</html>
