<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mute — Quietude Ambient Mixer</title>
  <meta name="description" content="의식의 가장 고요한 곳으로. 나만을 위한 커스텀 ASMR 믹서와 감각적인 멍 비주얼을 경험하세요." data-i18n-attr="content:pageDescription">

  <!-- 아이콘 & 홈 화면 설치(PWA) -->
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#07070a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MUTE">

  <!-- SNS 공유 미리보기 (오픈 그래프 & 트위터 카드)
       이미지는 tools/generate_og_image.py로 생성. 배포 주소가 바뀌면 아래 URL 3곳(og:url, og:image, twitter:image)을 함께 수정 -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="MUTE">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:title" content="MUTE — 고요한 앰비언트 사운드 믹서">
  <meta property="og:description" content="빗소리·모닥불·파도·우주의 소리를 겹쳐 듣는 나만의 앰비언트 사운드 믹서. 의식의 가장 고요한 곳으로.">
  <meta property="og:url" content="https://mute-web.ruberose0205.workers.dev/">
  <meta property="og:image" content="https://mute-web.ruberose0205.workers.dev/assets/images/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="숲 배경 위에 '의식의 가장 고요한 곳으로'라는 문구와 보랏빛 동심원 로고">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="MUTE — 고요한 앰비언트 사운드 믹서">
  <meta name="twitter:description" content="빗소리·모닥불·파도·우주의 소리를 겹쳐 듣는 나만의 앰비언트 사운드 믹서.">
  <meta name="twitter:image" content="https://mute-web.ruberose0205.workers.dev/assets/images/og-image.jpg">
  <link rel="canonical" href="https://mute-web.ruberose0205.workers.dev/">

  <!-- 검색엔진용 구조화 데이터: 무료 웹 앱 -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "MUTE",
    "url": "https://mute-web.ruberose0205.workers.dev/",
    "description": "빗소리·모닥불·파도·우주의 소리를 겹쳐 듣는 무료 앰비언트 사운드 믹서",
    "applicationCategory": "MultimediaApplication",
    "operatingSystem": "Any (web browser)",
    "inLanguage": ["ko", "en"],
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "KRW" }
  }
  </script>

  <!-- 서체 (Pretendard 하나로 한글/영문 모두 처리) -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 테마별 배경: 이미지 색감(CSS) + 분위기 입자 레이어(캔버스) -->
  <div id="theme-backdrop" aria-hidden="true"></div>
  <canvas id="ambient-canvas" aria-hidden="true"></canvas>

  <!-- 화면 낭독기용 알림 (토스트 문구를 읽어줌) -->
  <div id="sr-announcer" class="sr-only" role="status" aria-live="polite"></div>

  <!-- 언어 전환 (테마 선택 화면 우측 상단) -->
  <button type="button" class="btn-lang" id="btn-lang" data-i18n="langToggle" data-i18n-attr="aria-label:langToggleAria">English</button>

  <!-- ==========================================================================
       첫 페이지: 테마 선택 화면
       ========================================================================== -->
  <div id="theme-select-page">
    <div class="theme-select-container">
      <h1 class="theme-select-title">Mute</h1>

      <!-- 공유받은 믹스 링크로 들어왔을 때 표시 (자동 재생은 브라우저가 막으므로 한 번 눌러서 시작) -->
      <div class="shared-mix-banner" id="shared-mix-banner" hidden>
        <span id="shared-mix-text"></span>
        <button type="button" class="btn-shared-mix-play" id="btn-shared-mix-play" data-i18n="listen">들어보기</button>
        <button type="button" class="btn-shared-mix-dismiss" id="btn-shared-mix-dismiss" data-i18n-attr="aria-label:close">×</button>
      </div>
      <p class="theme-select-subtitle" data-i18n="subtitle">의식의 가장 고요한 곳으로. 오늘의 호흡에 어울리는 소리 무드를 선택하세요.</p>

      <!-- 마지막으로 들은 테마 바로 열기 -->
      <button type="button" class="btn-resume-last" id="btn-resume-last" hidden>
        <svg class="icon-svg" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg>
        <span id="resume-last-text"></span>
      </button>

      <div class="theme-buttons-grid" role="group" data-i18n-attr="aria-label:themeListAria">
        <!-- 🌳 자연 테마 (나무) -->
        <button type="button" class="btn-theme-select" id="btn-theme-nature" data-theme="nature">
          <div class="card-icon-wrapper" aria-hidden="true">
            <svg class="card-icon" fill="none" stroke="currentColor" stroke-width="1.2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 3l-6 8h3l-4 6h14l-4-6h3l-6-8zM12 17v4"/>
            </svg>
          </div>
          <span class="theme-name">NATURE</span>
        </button>

        <!-- 🔮 판타지 테마 (반짝임) -->
        <button type="button" class="btn-theme-select" id="btn-theme-fantasy" data-theme="fantasy">
          <div class="card-icon-wrapper" aria-hidden="true">
            <svg class="card-icon" fill="none" stroke="currentColor" stroke-width="1.2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3zM18.5 15.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7.7-1.8z"/>
            </svg>
          </div>
          <span class="theme-name">FANTASY</span>
        </button>

        <!-- 🌙 으스스한 밤 테마 (달) -->
        <button type="button" class="btn-theme-select" id="btn-theme-horror" data-theme="horror">
          <div class="card-icon-wrapper" aria-hidden="true">
            <svg class="card-icon" fill="none" stroke="currentColor" stroke-width="1.2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
            </svg>
          </div>
          <span class="theme-name">EERIE NIGHT</span>
        </button>

        <!-- 🌊 바다 테마 (물결) -->
        <button type="button" class="btn-theme-select" id="btn-theme-ocean" data-theme="ocean">
          <div class="card-icon-wrapper" aria-hidden="true">
            <svg class="card-icon" fill="none" stroke="currentColor" stroke-width="1.2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2 9c2 0 2-1.5 4-1.5S8 9 10 9s2-1.5 4-1.5S16 9 18 9s2-1.5 4-1.5M2 14c2 0 2-1.5 4-1.5S8 14 10 14s2-1.5 4-1.5S16 14 18 14s2-1.5 4-1.5M2 19c2 0 2-1.5 4-1.5S8 19 10 19s2-1.5 4-1.5S16 19 18 19s2-1.5 4-1.5"/>
            </svg>
          </div>
          <span class="theme-name">OCEAN</span>
        </button>

        <!-- 🪐 우주 테마 (행성) -->
        <button type="button" class="btn-theme-select" id="btn-theme-space" data-theme="space">
          <div class="card-icon-wrapper" aria-hidden="true">
            <svg class="card-icon" fill="none" stroke="currentColor" stroke-width="1.2" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="5"/>
              <ellipse cx="12" cy="12" rx="10.5" ry="3.2" transform="rotate(-20 12 12)"/>
            </svg>
          </div>
          <span class="theme-name">DEEP SPACE</span>
        </button>

        <!-- 🎛️ 나만의 믹스 (모든 테마의 소리를 섞기) -->
        <button type="button" class="btn-theme-select" id="btn-theme-custom" data-theme="custom">
          <div class="card-icon-wrapper" aria-hidden="true">
            <svg class="card-icon" fill="none" stroke="currentColor" stroke-width="1.2" viewBox="0 0 24 24">
              <path stroke-linecap="round" d="M5 4v16M12 4v16M19 4v16"/>
              <circle cx="5" cy="14" r="2" fill="currentColor"/>
              <circle cx="12" cy="8" r="2" fill="currentColor"/>
              <circle cx="19" cy="16" r="2" fill="currentColor"/>
            </svg>
          </div>
          <span class="theme-name">MY MIX</span>
        </button>
      </div>

      <!-- 테마 선택 화면 최하단 공유 단추 -->
      <button type="button" class="btn-share-main" id="btn-share-main" data-i18n-attr="title:shareSiteTitle">
        <span data-i18n="shareSite">감성 공유하기</span>
        <svg class="icon-svg" fill="none" stroke="currentColor" stroke-width="1.2" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M8.684 10.742l5.292-3.176m0 8.868l-5.292-3.176M21 12a3 3 0 11-6 0 3 3 0 016 0zm-12 6a3 3 0 11-6 0 3 3 0 016 0zm0-12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
      </button>

      <!-- 안내 페이지 링크 (tools/build_pages.py로 생성) -->
      <nav class="site-footer-links" data-i18n-attr="aria-label:footerAria">
        <a href="/about/" data-i18n="footerAbout">소개·사용법</a>
        <a href="/themes/" data-i18n="footerThemes">테마 안내</a>
        <a href="/guides/sleep/" data-i18n="footerSleep">수면 가이드</a>
        <a href="/guides/focus/" data-i18n="footerFocus">집중 가이드</a>
        <a href="/privacy/" data-i18n="footerPrivacy">개인정보처리방침</a>
      </nav>
    </div>
  </div>

  <!-- ==========================================================================
       믹서 및 멍 페이지
       ========================================================================== -->
  <div id="mixer-page" style="display: none;">

    <main class="main-arena" id="main-arena">

      <!-- 상단 유틸리티 바 (테마 선택 - 전체화면 멍 - 믹서 설정) -->
      <div class="header-utility-bar" id="header-utility-bar">
        <button type="button" class="btn-theme-back" id="btn-theme-back">
          <svg class="icon-svg" fill="none" stroke="currentColor" stroke-width="1.2" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
          <span data-i18n="backToThemes">테마 선택</span>
        </button>

        <button type="button" class="btn-focus-toggle" id="btn-focus-toggle" data-i18n-attr="title:focusModeTitle">
          <span data-i18n="focusMode">전체 화면 멍</span>
          <svg class="icon-svg" fill="none" stroke="currentColor" stroke-width="1.2" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
        </button>

        <div class="header-right-group">
          <button type="button" class="btn-settings-toggle" id="btn-drawer-toggle" aria-controls="settings-drawer" aria-expanded="false">
            <span data-i18n="mixerSettings">믹서 설정</span>
            <svg class="icon-svg" fill="none" stroke="currentColor" stroke-width="1.2" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/></svg>
          </button>
        </div>
      </div>

      <header class="arena-header">
        <h1 id="app-title">MUTE</h1>
        <p class="description" id="app-description" data-i18n="appDescription">복잡한 설정은 숨겨두고, 비주얼과 소리에 깊이 몰입해 보세요.</p>
      </header>

      <!-- 상단 제어 및 마스터 볼륨 영역 -->
      <section class="top-controls-wrapper" id="top-controls">
        <div class="controls-container" id="player-controls">
          <button type="button" id="btn-play-all" data-i18n="playAll">전체 재생</button>
          <button type="button" id="btn-stop-all" data-i18n="stopAll">전체 정지</button>
        </div>

        <div class="master-volume-container" id="master-volume-box">
          <label for="master-volume" class="master-volume-label" id="master-volume-label" data-i18n="masterVolume">마스터 볼륨</label>
          <div class="master-slider-row">
            <input type="range" class="master-volume-slider" id="master-volume" min="0" max="1" step="0.01" value="1">
          </div>
        </div>
      </section>

      <!-- 중앙 비주얼 멍 공간 (클릭/Enter로 몰입 모드 전환) -->
      <section class="visual-space" id="visual-space-zone" role="button" tabindex="0" data-i18n-attr="aria-label:visualSpaceAria,title:visualSpaceAria">
        <canvas id="mung-canvas" aria-hidden="true"></canvas>

        <div class="mung-text-overlay">
          <span class="mung-sub-title" data-i18n="visualSub">공간의 흐름</span>
          <h2 id="current-bg-name">NATURE ROOM</h2>
          <span id="theme-visual-text" class="mung-description"></span>
        </div>
      </section>

      <!-- 취침 타이머 -->
      <section class="timer-container" id="timer-section" aria-labelledby="timer-section-title">
        <h3 class="timer-title" id="timer-section-title" data-i18n="timerTitle">취침 예약 타이머</h3>

        <div class="timer-controls-row timer-presets" role="group" data-i18n-attr="aria-label:timerPresetsAria">
          <button type="button" class="btn-timer-preset" data-minutes="15" data-i18n="min15">15분</button>
          <button type="button" class="btn-timer-preset" data-minutes="30" data-i18n="min30">30분</button>
          <button type="button" class="btn-timer-preset" data-minutes="60" data-i18n="min60">1시간</button>
          <button type="button" class="btn-timer-preset" data-minutes="90" data-i18n="min90">1시간 30분</button>
        </div>

        <div class="timer-controls-row" id="timer-inputs-container">
          <input type="number" class="timer-input-field" id="timer-input" min="1" placeholder="분" data-i18n-attr="placeholder:timerPlaceholder,aria-label:timerInputAria">
          <button type="button" class="btn-timer-action" id="btn-timer-start" data-i18n="start">시작</button>
          <button type="button" class="btn-timer-action" id="btn-timer-cancel" data-i18n="cancel">취소</button>
        </div>

        <div class="timer-display-label" id="timer-display"></div>
      </section>

      <!-- 지금 믹스(테마 + 볼륨 + 켜진 소리)를 링크로 공유 -->
      <button type="button" class="btn-share-mixer" id="btn-share-mixer" data-i18n-attr="title:shareMixTitle">
        <span data-i18n="shareMix">이 믹스 공유하기</span>
        <svg class="icon-svg" fill="none" stroke="currentColor" stroke-width="1.2" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M8.684 10.742l5.292-3.176m0 8.868l-5.292-3.176M21 12a3 3 0 11-6 0 3 3 0 016 0zm-12 6a3 3 0 11-6 0 3 3 0 016 0zm0-12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
      </button>

    </main>

    <!-- 몰입 모드 시 우측 상단 컨트롤 -->
    <div class="focus-overlay-controls" id="focus-overlay-controls" style="display: none;">
      <button type="button" class="btn-focus-restore" id="btn-focus-restore" data-i18n-attr="aria-label:showControls,title:showControls">
        <svg class="icon-svg" fill="none" stroke="currentColor" stroke-width="1.2" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
      <button type="button" class="btn-settings-toggle-focus" id="btn-drawer-toggle-focus" aria-controls="settings-drawer" aria-expanded="false" data-i18n-attr="aria-label:openMixer,title:openMixer">
        <svg class="icon-svg" fill="none" stroke="currentColor" stroke-width="1.2" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/></svg>
      </button>
    </div>

    <!-- ==========================================================================
         설정 서랍 (닫혀 있을 때는 inert로 키보드 포커스가 들어가지 않음)
         ========================================================================== -->
    <aside class="settings-drawer" id="settings-drawer" aria-labelledby="drawer-heading" inert>
      <div class="drawer-header" id="drawer-top">
        <h2 class="drawer-title" id="drawer-heading"></h2>
        <button type="button" class="btn-drawer-close" id="btn-drawer-close" data-i18n-attr="aria-label:close">
          <svg class="drawer-close-icon" fill="none" stroke="currentColor" stroke-width="1" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <!-- MY MIX 전용: 배경 고르기 -->
      <div class="backdrop-picker" id="backdrop-picker" hidden>
        <label for="backdrop-select" class="drawer-subtitle" data-i18n="backdrop">배경</label>
        <select id="backdrop-select" class="backdrop-select">
          <option value="nature">NATURE</option>
          <option value="fantasy">FANTASY</option>
          <option value="horror">EERIE NIGHT</option>
          <option value="ocean">OCEAN</option>
          <option value="space">DEEP SPACE</option>
        </select>
      </div>

      <section class="sounds-container" id="sounds-section">
        <ul class="sounds-list" id="sounds-list">
          <!-- 사운드 제어 항목이 동적으로 들어감 -->
        </ul>
      </section>

      <!-- 내 믹스 (테마별 프리셋 저장/불러오기) -->
      <section class="preset-section" aria-labelledby="preset-heading">
        <h3 class="drawer-subtitle" id="preset-heading" data-i18n="myMixes">내 믹스</h3>
        <form class="preset-save-row" id="preset-form">
          <input type="text" class="preset-name-input" id="preset-name" maxlength="20" data-i18n-attr="placeholder:presetPlaceholder,aria-label:presetNameAria">
          <button type="submit" class="btn-timer-action" data-i18n="save">저장</button>
        </form>
        <ul class="preset-list" id="preset-list"></ul>
      </section>

      <dl class="shortcut-hint" data-i18n-attr="aria-label:shortcutsAria">
        <div><dt>Space</dt><dd data-i18n="keyPlayPause">재생 / 일시정지</dd></div>
        <div><dt>1 – 9</dt><dd data-i18n="keySounds">소리 켜기 / 끄기</dd></div>
        <div><dt>F</dt><dd data-i18n="keyFocus">전체 화면 멍</dd></div>
        <div><dt>Esc</dt><dd data-i18n="keyEsc">닫기 / 나가기</dd></div>
      </dl>

      <button type="button" class="btn-lang-drawer" id="btn-lang-drawer" data-i18n="langToggle" data-i18n-attr="aria-label:langToggleAria">English</button>
    </aside>

  </div>

  <script src="js/i18n.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
